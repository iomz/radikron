---
name: build
on:
  pull_request:
    branches:
      - main
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        # Wails v3 compiles against GTK4 and WebKitGTK 6.0 on Linux.
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download Go modules
        run: go mod download
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: cmd/radikron-gui/frontend
      - name: Test frontend
        run: pnpm test
        working-directory: cmd/radikron-gui/frontend
      - name: Type-check frontend
        run: pnpm run typecheck
        working-directory: cmd/radikron-gui/frontend
      - name: Build frontend
        run: pnpm run build
        working-directory: cmd/radikron-gui/frontend
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test ./...
      - name: Install Wails CLI
        if: runner.os != 'Linux'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
      - name: Build GUI with Wails
        if: runner.os != 'Linux'
        working-directory: cmd/radikron-gui
        shell: bash
        run: |
          # Run the same tasks as release.yml so a broken GUI build fails
          # here instead of during a release.
          if [ "${{ runner.os }}" = "macOS" ]; then
            wails3 task package
          else
            wails3 task build
          fi
      - name: Check generated bindings are committed
        if: runner.os != 'Linux'
        run: git diff --exit-code -- cmd/radikron-gui/frontend/bindings
