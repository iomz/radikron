---
name: release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-gui:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: macOS_Intel
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: macOS_Apple_Silicon
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: Windows_x64
          - os: windows-latest
            goos: windows
            goarch: arm64
            platform: Windows_ARM64
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install create-dmg (macOS only)
        if: matrix.goos == 'darwin'
        run: |
          # Homebrew is pre-installed on GitHub Actions macOS runners
          brew install create-dmg

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: cmd/radikron-gui/frontend

      - name: Build GUI application
        working-directory: cmd/radikron-gui
        shell: bash
        run: |
          # The Wails v3 Taskfiles build the frontend and bindings, then the
          # binary for ARCH. On macOS, `package` also assembles and ad-hoc
          # signs bin/Radikron.app. Use `wails3 task`: the `wails3 package`
          # and `wails3 build` shortcuts do not forward ARCH to the tasks.
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            wails3 task package ARCH=${{ matrix.goarch }}
          else
            wails3 task build ARCH=${{ matrix.goarch }}
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          ARTIFACTS_DIR="${{ github.workspace }}/artifacts"
          # Asset names carry Go GOOS/GOARCH values so updaters can select them.
          # The radikron-gui_ prefix keeps them apart from CLI archives, and the
          # -installer suffix marks first-install packages that updaters skip.
          ASSET_BASE="radikron-gui_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd cmd/radikron-gui
          # Wails v3 outputs to the bin/ directory
          # macOS: .app bundle
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            echo "Checking for macOS build output..."
            ls -la bin/ || echo "bin/ does not exist"
            if [ -d "bin/Radikron.app" ]; then
              case "${{ matrix.goarch }}" in
                amd64) expected_arch=x86_64 ;;
                arm64) expected_arch=arm64 ;;
                *) echo "Unsupported macOS architecture: ${{ matrix.goarch }}"; exit 1 ;;
              esac
              app_binary="bin/Radikron.app/Contents/MacOS/radikron-gui"
              actual_arch=$(lipo -archs "$app_binary")
              if [ "$actual_arch" != "$expected_arch" ]; then
                echo "Expected $expected_arch app binary, got $actual_arch"
                exit 1
              fi
              codesign --force --deep --sign - bin/Radikron.app
              codesign --verify --deep --strict --verbose=2 bin/Radikron.app
              echo "Creating update archive with Radikron.app as its only top-level entry..."
              ditto -c -k --norsrc --noextattr --keepParent bin/Radikron.app "$ARTIFACTS_DIR/${ASSET_BASE}.app.zip"
              top_level=$(zipinfo -1 "$ARTIFACTS_DIR/${ASSET_BASE}.app.zip" | cut -d/ -f1 | sort -u)
              if [ "$top_level" != "Radikron.app" ]; then
                echo "Expected Radikron.app as the only top-level entry, got: $top_level"
                exit 1
              fi
              echo "Found Radikron.app, creating DMG with drag-and-drop interface..."
              # Create DMG using create-dmg for better user experience
              # --volname: Volume name shown when DMG is mounted
              # --window-size: Size of the DMG window
              # --icon-size: Size of icons in the DMG
              # --app-drop-link: Creates a link to Applications folder at specified position
              # --hdiutil-quiet: Suppress verbose output
              create-dmg \
                --volname "Radikron" \
                --window-size 600 400 \
                --icon-size 100 \
                --app-drop-link 450 185 \
                --hdiutil-quiet \
                "$ARTIFACTS_DIR/${ASSET_BASE}-installer.dmg" \
                bin/Radikron.app
            else
              echo "ERROR: No macOS build output found in bin/"
              ls -la bin/ || echo "bin/ does not exist"
              exit 1
            fi
          # Windows: .exe file
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            echo "Checking for Windows build output..."
            if [ -f "bin/radikron-gui.exe" ]; then
              echo "Found radikron-gui.exe, copying..."
              cp bin/radikron-gui.exe "$ARTIFACTS_DIR/${ASSET_BASE}.exe"
            else
              echo "ERROR: radikron-gui.exe not found in bin/"
              ls -la bin/ || echo "bin/ does not exist"
              exit 1
            fi
          fi
          echo "Artifacts prepared:"
          ls -la "$ARTIFACTS_DIR/" || echo "artifacts/ directory is empty or does not exist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radikron-gui-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  build-cli:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build CLI artifacts
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radikron-cli
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  upload-release:
    needs: [build-gui, build-cli]
    runs-on: ubuntu-latest
    # The signing key is an environment secret so only release runs can read it.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum -- * > ../checksums.txt
          mv ../checksums.txt checksums.txt

      - name: Sign release assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "RELEASE_SIGNING_KEY is not set; refusing to publish unsigned assets"
            exit 1
          fi
          key_file="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file")
          for asset in release-assets/*; do
            # ECDSA P-256 over SHA-256 of the asset, DER-encoded
            openssl dgst -sha256 -sign "$key_file" -out "$asset.sig" "$asset"
            # Fail if the secret does not match the public key shipped in the binaries
            openssl dgst -sha256 -verify internal/releasekey/public_key.pem \
              -signature "$asset.sig" "$asset"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
