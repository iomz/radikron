---
name: gui-release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-gui:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: darwin_amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin_arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows_amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
            platform: windows_arm64
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: cmd/radikron-gui/frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: cmd/radikron-gui/frontend

      - name: Build GUI application
        working-directory: cmd/radikron-gui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Wails builds natively for the runner's architecture
          # For cross-compilation (e.g., Windows ARM64), GOOS and GOARCH are set via env
          wails build -clean

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          ARTIFACTS_DIR="${{ github.workspace }}/artifacts"
          cd cmd/radikron-gui
          # Wails outputs to build/bin/ directory
          # macOS: .app bundle
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            echo "Checking for macOS build output..."
            ls -la build/bin/ || echo "build/bin/ does not exist"
            if [ -d "build/bin/Radikron.app" ]; then
              echo "Found Radikron.app, creating DMG..."
              # Create DMG using hdiutil (built-in macOS tool)
              # -volname: Volume name shown when DMG is mounted
              # -srcfolder: Source folder (.app bundle)
              # -ov: Overwrite if exists
              # -format UDZO: Compressed DMG format
              hdiutil create -volname "Radikron" -srcfolder build/bin/Radikron.app -ov -format UDZO "$ARTIFACTS_DIR/Radikron_${{ matrix.platform }}.dmg"
            elif [ -f "build/bin/radikron-gui" ]; then
              echo "Found radikron-gui binary, copying..."
              cp build/bin/radikron-gui "$ARTIFACTS_DIR/radikron-gui_${{ matrix.platform }}"
            else
              echo "ERROR: No macOS build output found in build/bin/"
              ls -la build/bin/ || echo "build/bin/ does not exist"
              exit 1
            fi
          # Windows: .exe file
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            echo "Checking for Windows build output..."
            if [ -f "build/bin/radikron-gui.exe" ]; then
              echo "Found radikron-gui.exe, copying..."
              cp build/bin/radikron-gui.exe "$ARTIFACTS_DIR/radikron-gui_${{ matrix.platform }}.exe"
            else
              echo "ERROR: radikron-gui.exe not found in build/bin/"
              ls -la build/bin/ || echo "build/bin/ does not exist"
              exit 1
            fi
            # Check for NSIS installer (if generated)
            find build/bin -name "*.exe" -type f ! -name "radikron-gui.exe" -exec cp {} "$ARTIFACTS_DIR/" \;
          fi
          echo "Artifacts prepared:"
          ls -la "$ARTIFACTS_DIR/" || echo "artifacts/ directory is empty or does not exist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radikron-gui-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  upload-release:
    needs: build-gui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-artifacts -type f -exec cp {} release-assets/ \;

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

