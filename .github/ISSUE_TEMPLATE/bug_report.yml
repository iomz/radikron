name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please provide the exact steps, commands, or GUI operations.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: radikron version
      placeholder: v0.7.4
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - GUI
        - CLI
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: config.yml
      description: Paste your relevant config.yml. Remove secrets if any.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the full error message or logs.
      render: text
